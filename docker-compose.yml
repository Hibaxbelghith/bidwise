

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: bidwise_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      HIINTERNS_USE_SITEMAP: ${HIINTERNS_USE_SITEMAP:-true}
      HIINTERNS_USE_RSC: ${HIINTERNS_USE_RSC:-true}
      HIINTERNS_USE_PLAYWRIGHT: ${HIINTERNS_USE_PLAYWRIGHT:-false}
      HIINTERNS_SITEMAP_URL: ${HIINTERNS_SITEMAP_URL:-https://hi-interns.com/sitemap.xml}
      HIINTERNS_TRACE_API: ${HIINTERNS_TRACE_API:-false}
      HIINTERNS_TRACE_STDOUT: ${HIINTERNS_TRACE_STDOUT:-false}
      HIINTERNS_TRACE_FIRST_PARTY_ONLY: ${HIINTERNS_TRACE_FIRST_PARTY_ONLY:-true}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: pgvector/pgvector:pg16
    container_name: bidwise_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
