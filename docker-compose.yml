

services:
  migrate:
    image: bidwise-backend:latest
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: bidwise_migrate
    command: python manage.py migrate --noinput
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: bidwise-backend:latest
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: bidwise_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    image: bidwise-backend:latest
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: bidwise_celery_worker
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    image: bidwise-backend:latest
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: bidwise_celery_beat
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    image: bidwise-backend:latest
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: bidwise_flower
    command: celery -A config flower --address=0.0.0.0 --port=5555
    volumes:
      - ./backend:/app
    ports:
      - "5555:5555"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started

  db:
    image: pgvector/pgvector:pg16
    container_name: bidwise_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bidwise_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
